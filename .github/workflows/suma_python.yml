name: Deploy Web App to GitHub Pages 🚀

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      numero1:
        description: 'Escribe el primer número'
        required: true
        default: '50'
      numero2:
        description: 'Escribe el segundo número'
        required: true
        default: '100'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de suma
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_NUM1: ${{ github.event.inputs.numero1 }}
          INPUT_NUM2: ${{ github.event.inputs.numero2 }}
        run: |
          if [ -n "$INPUT_NUM1" ] && [ -n "$INPUT_NUM2" ]; then
            python sumar.py "$INPUT_NUM1" "$INPUT_NUM2"
          else
            python sumar.py
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Confirmación de despliegue
        run: |
          echo "¡El cálculo se probó correctamente en el job 'test'!"
          echo "Desplegando la aplicación..."